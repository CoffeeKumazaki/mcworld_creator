[project]
name = "mcworld-creator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3,<2",
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "lxml>=5.0,<6",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "pillow>=10.0,<11",
    "tqdm>=4.60,<5",
    "trimesh>=4.0,<5",
    "open3d>=0.18,<1",
    "scipy>=1.14,<2",
    "nbt>=1.5,<2",
    "frozendict>=2.4,<3",
]

[project.optional-dependencies]
gdal = ["GDAL>=3.5,<4"]
osm = ["osmium>=3.7,<4"]
